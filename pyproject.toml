[project]
name = "mm-opd"
version = "0.1.0"
description = "Encoder-free text LLM trained with on-policy distillation from a same-family VLM."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch",
    "transformers",
    "peft",
    "accelerate",
    "datasets",
    "pillow",
]

[project.optional-dependencies]
deepspeed = ["deepspeed"]
eval = ["lm-eval"]

[build-system]
requires = ["uv_build>=0.12.0,<0.14.0"]
build-backend = "uv_build"

# torch comes from the default index (PyPI / Tsinghua mirror); its Linux wheels bundle CUDA.
# download.pytorch.org is unreachable from the A800 cluster.
